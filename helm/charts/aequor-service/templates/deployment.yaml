apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aequor-service.fullname" . }}
  labels:
    {{- include "aequor-service.labels" . | nindent 4 }}
spec:
  # feed/settlement/... are singletons in this reference stack; scale via replicaCount.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "aequor-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aequor-service.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aequor-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.service }}
          image: {{ include "aequor-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # readOnlyRootFilesystem is on, so give the client libs a writable /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            # SERVICE mirrors the build arg; harmless for baked images, and lets a
            # future single-image runtime dispatch on it.
            - name: SERVICE
              value: {{ .Values.service | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.metrics.path }}
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.metrics.path }}
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
