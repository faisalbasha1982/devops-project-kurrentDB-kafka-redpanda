name: ci-terratest

# Terratest against terraform/modules/eks. Needs AWS creds (module init pulls
# providers; plan/apply hit the AWS API), so it's manual-dispatch only and
# authenticates via GitHub OIDC -> an assume-role step (no static keys).
on:
  workflow_dispatch:
    inputs:
      run_apply:
        description: "Run the full apply+destroy path (creates billable infra)"
        type: boolean
        default: false

permissions:
  id-token: write   # required to mint the OIDC token for AWS assume-role
  contents: read

jobs:
  terratest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          # go.sum is generated by `go test` (go mod download) on first run;
          # disable the built-in cache so a missing go.sum doesn't fail setup.
          cache: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # PLACEHOLDER: wire this to your CI OIDC role before running.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::111111111111:role/aequor-ci-terratest
          aws-region: us-east-1

      - name: go test
        working-directory: test/terratest
        env:
          # Flip via the workflow_dispatch input; default is plan-only.
          RUN_EKS_APPLY: ${{ inputs.run_apply }}
        run: |
          go test -v -timeout 45m ./...
