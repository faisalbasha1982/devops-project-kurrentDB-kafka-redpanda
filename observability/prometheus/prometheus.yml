global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Redpanda exposes Prometheus metrics on its admin port.
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  # KurrentDB exposes native Prometheus metrics. If this target shows as "down"
  # with a 404 on first run, check the metrics path for your server version in
  # the Admin UI (Diagnostics) and adjust here — we confirm it in Phase 0c.
  - job_name: kurrentdb
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["kurrentdb:2113"]

  # Pipeline services expose /metrics on :8000 (settlement, reconciler).
  - job_name: aequor-services
    static_configs:
      - targets: ["settlement:8000", "reconciler:8000"]
